name: Windows

# Proves the Windows build on Windows itself: the system check reads Do not disturb,
# presenting and the microphone, the app packages with its own icon, flights and the
# Settings page render, the listener answers, and Start with Windows takes. The
# rendered frames are uploaded to look at.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run assets

      - name: System check reads Do not disturb, presenting and calls
        run: >
          node -e "require('./system').readSystem().then(s => { console.log(s);
          if (s.focusProfile === null || s.notificationState === null || s.microphone === null) process.exit(1) })"

      - name: Fetch Electron through the GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$(cygpath -m "$RUNNER_TEMP")/electron-zips"
          bash scripts/fetch-electron.sh "$dir"
          echo "ELECTRON_ZIP_DIR=$dir" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: npm run package

      - name: The exe carries the app's name
        shell: pwsh
        run: |
          $info = (Get-Item "dist\Sushi Buddy-win32-x64\Sushi Buddy.exe").VersionInfo
          $info | Format-List ProductName, FileDescription, ProductVersion
          if ($info.ProductName -ne 'Sushi Buddy') { throw "ProductName is '$($info.ProductName)'" }

      - name: Render flights, Settings and the tour
        shell: pwsh
        run: |
          $exe = "dist\Sushi Buddy-win32-x64\Sushi Buddy.exe"
          Start-Process -Wait -FilePath $exe -ArgumentList '--preview', "$env:GITHUB_WORKSPACE\preview.png", '--at', '0.9,3,5.9'
          Start-Process -Wait -FilePath $exe -ArgumentList '--preview', "$env:GITHUB_WORKSPACE\preview-loop.png", '--path', 'loop', '--at', '0.9'
          Start-Process -Wait -FilePath $exe -ArgumentList '--preview', "$env:GITHUB_WORKSPACE\preview-pet.png", '--at', '2.5', '--pets', '2.2'
          Start-Process -Wait -FilePath $exe -ArgumentList '--preview-settings', "$env:GITHUB_WORKSPACE"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\tour" | Out-Null
          Start-Process -Wait -FilePath $exe -ArgumentList '--preview-tour', "$env:GITHUB_WORKSPACE\tour"
          Get-ChildItem "$env:GITHUB_WORKSPACE\preview-*.png", "$env:GITHUB_WORKSPACE\settings.png" -ErrorAction Stop
          $steps = @(Get-ChildItem "$env:GITHUB_WORKSPACE\tour\tour-*.png")
          if ($steps.Count -ne 9) { throw "rendered $($steps.Count) tour steps, not 9" }

      - name: The listener answers on 127.0.0.1
        shell: pwsh
        run: |
          $app = Start-Process -PassThru -FilePath "dist\Sushi Buddy-win32-x64\Sushi Buddy.exe"
          try {
            Start-Sleep -Seconds 8
            $hello = curl.exe -s http://127.0.0.1:7874/
            "GET / -> $hello"
            if ($hello -notmatch 'Sushi Buddy') { throw "no answer from the listener" }
            $fly = curl.exe -s -o NUL -w '%{http_code}' -d 'Hello from CI' http://127.0.0.1:7874/fly
            $origin = curl.exe -s -o NUL -w '%{http_code}' -H 'Origin: https://example.com' -d 'x' http://127.0.0.1:7874/fly
            $claude = '{"hook_event_name":"Stop","session_id":"ci"}' | curl.exe -s -o NUL -w '%{http_code}' --data-binary '@-' http://127.0.0.1:7874/claude
            "POST /fly -> $fly, with an Origin -> $origin, POST /claude -> $claude"
            if ($fly -ne '204' -or $origin -ne '403' -or $claude -ne '204') { throw "unexpected status" }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Get-Process 'Sushi Buddy' -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Start with Windows turns on and off
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\Sushi Buddy-win32-x64\Sushi Buddy.exe").Path
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          function Entries { (Get-ItemProperty $run -ErrorAction SilentlyContinue).PSObject.Properties |
            Where-Object { "$($_.Value)" -like "*Sushi Buddy.exe*" } }

          Start-Process -Wait -FilePath $exe -ArgumentList '--launch-at-login', 'on'
          $on = @(Entries)
          $on | Format-List Name, Value
          if ($on.Count -ne 1) { throw "expected one Run entry for Sushi Buddy, found $($on.Count)" }

          Start-Process -Wait -FilePath $exe -ArgumentList '--launch-at-login', 'off'
          $off = @(Entries)
          if ($off.Count -ne 0) { throw "the Run entry is still there after off" }
          'on and off both took'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: |
            preview-*.png
            settings.png
            tour/*.png
